schema: ./src/**/*.graphql
config:
  contextType: "~/context.js#Context"
generates:
  src/model/schema.generated.ts:
    config:
      scalars:
        Timestamp: number
        Date: Date
      maybeValue: "T | undefined"
    plugins:
      - "@graphql-codegen/typescript"
      - "@graphql-codegen/typescript-resolvers"
