type Query {
	igdb: Igdb!
}

type Igdb {
	search(query: String!): [IgdbSearchResult!]!
	upcomingEvents: [IgdbGamingEvent!]!
}

# Data

type IgdbSearchResult {
	id: String!
	title: String!
	slug: String!
}

type IgdbGamingEvent {
	id: String!
	name: String!
	scheduledStartAt: Timestamp!
	scheduledEndAt: Timestamp!
	image: String
	description: String
	url: String
}
